media:
  input: Assets
  output: Assets
content:
  - name: settings
    label: Site Content
    type: file
    path: content/data.json
    fields:
      - name: hero
        label: Hero Section
        type: object
        fields:
          - name: greeting
            label: Greeting
            type: string
          - name: title
            label: Title
            type: string
          - name: typed_text
            label: Typed Text (Roles)
            type: string
            list: true
          - name: subtitle
            label: Subtitle
            type: text
          - name: highlights
            label: Highlights
            type: string
            list: true
      - name: about
        label: About Section
        type: object
        fields:
          - name: lead_html
            label: Intro Text (HTML allowed)
            type: text
          - name: cards
            label: Info Cards
            type: object
            list: true
            fields:
              - name: icon
                label: FontAwesome Icon Class
                type: string
              - name: title
                label: Title
                type: string
              - name: description
                label: Description
                type: text
          - name: stats
            label: Statistics
            type: object
            list: true
            fields:
              - name: number
                label: Number
                type: string
              - name: label
                label: Label
                type: string
      - name: experience
        label: Experience
        type: object
        list: true
        fields:
          - name: date
            label: Date Range
            type: string
          - name: title
            label: Role Title
            type: string
          - name: subtitle
            label: Company & Location
            type: string
          - name: projects
            label: Projects
            type: object
            list: true
            fields:
              - name: title
                label: Project Title
                type: string
              - name: bullets
                label: Bullet Points
                type: string
                list: true
      - name: projects
        label: Case Studies
        type: object
        list: true
        fields:
          - name: label
            label: Type Label
            type: string
          - name: title
            label: Project Title
            type: string
          - name: icon
            label: FontAwesome Icon Class
            type: string
          - name: summary
            label: Summary
            type: text
          - name: details
            label: Details Sections
            type: object
            list: true
            fields:
              - name: heading
                label: Heading
                type: string
              - name: text
                label: Text
                type: text
          - name: tags
            label: Tags
            type: string
            list: true
      - name: skills
        label: Skills
        type: object
        list: true
        fields:
          - name: icon
            label: FontAwesome Icon Class
            type: string
          - name: title
            label: Category Title
            type: string
          - name: skills_list
            label: Skills
            type: string
            list: true
      - name: education
        label: Education
        type: object
        list: true
        fields:
          - name: icon
            label: FontAwesome Icon Class
            type: string
          - name: title
            label: Degree
            type: string
          - name: school
            label: School
            type: string
          - name: meta
            label: Location & Date
            type: string
          - name: score
            label: Score / CGPA
            type: string
      - name: contact
        label: Contact Info
        type: object
        fields:
          - name: email
            label: Email Address
            type: string
          - name: phone
            label: Phone Number
            type: string
          - name: location
            label: Location
            type: string
          - name: linkedin
            label: LinkedIn Handle
            type: string
          - name: linkedin_url
            label: LinkedIn URL
            type: string
